schema_version: 1
title: "Beta"
description: "SPACE Studio prototype (v0.5) with the Structured Detection outputs
  for five HDB floor plans."
icon: sparkles
accent_color: "#B99A81"

routes:
  - path: home
    module: pages/home.js
    title: "Overview"
    hidden: true
  - path: detection
    module: pages/detection.js
    title: "Structured Detection"
    hidden: true
  - path: prototype
    module: pages/prototype.js
    title: "Prototype"
    home: true

styles:
  - styles.css

